
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Лабораторна робота №1 – блоки</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>

<div class="layout layout--blocks">

    <!-- Блок 1 -->
    <header class="block block--header">
        <h2>Блок 1</h2>
    </header>

    <!-- Блок 5 -->
    <aside class="block block--left">
        <h2>Блок 5</h2>
    </aside>

    <!-- Блок 4 -->
    <main class="block block--main">

        <h1>Блок 4</h1>

        <p>
            <b>Основний блок</b>
            <i>з текстовим текстом.</i>
        </p>

        <h2>Текст</h2>

        <ul>
            <li>Пункт 1</li>
            <li>Пункт 2</li>
            <li>Пункт 3</li>
        </ul>


    </main>

    <!-- Блок 2 -->
    <aside class="block block--right">
        <h2>Блок 2</h2>
    </aside>

    <!-- Блок 3 -->
    <footer class="block block--footer">
        <h2>Блок 3</h2>
    </footer>

</div>

</body>
</html>
